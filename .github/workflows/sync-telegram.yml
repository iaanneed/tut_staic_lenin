name: Sync Telegram monuments

on:
  workflow_dispatch:

concurrency:
  group: sync-telegram
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run pytest

      - name: Create temporary Telegram export
        run: |
          echo "TELEGRAM_EXPORT=$(mktemp -d)" >> "$GITHUB_ENV"
          cp monuments.geojson "$RUNNER_TEMP/monuments-before.geojson"
          cp possible_lenin.geojson "$RUNNER_TEMP/possible-before.geojson"

      - name: Fetch new Telegram posts
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: uv run python scripts/fetch_telegram_channel.py --output "$TELEGRAM_EXPORT"

      - name: Add new monuments
        run: >
          uv run python scripts/parse_new_monuments.py
          --export "$TELEGRAM_EXPORT"
          --require-coordinates
          --added-ids-output "$RUNNER_TEMP/added-source-ids.json"

      - name: Compute bearings for new monuments
        run: uv run python scripts/compute_view_bearing.py

      - name: Remove confirmed monuments from possible layer
        run: uv run python scripts/prune_possible.py

      - name: Validate generated data
        run: uv run python scripts/validate_data.py

      - name: Build pull request description
        run: >
          uv run python scripts/build_sync_pr_body.py
          --monuments-before "$RUNNER_TEMP/monuments-before.geojson"
          --monuments-after monuments.geojson
          --possible-before "$RUNNER_TEMP/possible-before.geojson"
          --possible-after possible_lenin.geojson
          --added-ids "$RUNNER_TEMP/added-source-ids.json"
          --output "$RUNNER_TEMP/sync-pr-body.md"

      - name: Detect data changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- monuments.geojson possible_lenin.geojson photos/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: automation/telegram-sync-${{ github.run_id }}
        shell: bash
        run: |
          PR_TITLE="Telegram sync — $(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add monuments.geojson possible_lenin.geojson photos/
          git commit -m "Sync new Lenin monuments from Telegram"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/sync-pr-body.md"
